version: '3.9'
services:
  app:
    build: .
    container_name: parse-tg-news-app
    environment:
      - MONGODB_URI=mongodb://mongo:27017/news
      - MONGODB_DB=news
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - ollama
  mongo:
    image: mongo:8.0
    container_name: parse-tg-news-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  ollama:
    image: ollama/ollama:latest
    container_name: parse-tg-news-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    # При первом запуске автоматически загрузим модель llama3.2
    command: ["bash", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && tail -f /dev/null"]
volumes:
  mongo-data:
  ollama-data: 